; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:giga_r1_m7]
platform = ststm32
board = giga_r1_m7
framework = arduino
lib_extra_dirs = 
monitor_speed = 115200

# Force deep scanning to locate internal Mbed framework libraries
lib_ldf_mode = deep+

# Explicitly pull the core WiFi library bundled with the Mbed framework
lib_deps =
    WiFi

; Explicitly ignore global WiFiNINA libraries
lib_ignore = 
    WiFiNINA
    Adafruit WiFiNINA
    Adafruit_WiFiNINA
    STM32duino_STM32Ethernet
    STM32Ethernet